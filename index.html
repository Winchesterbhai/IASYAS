<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IASYAS - UPSC PYQ Explorer</title>
</head>

<body>

  <h1>IASYAS</h1>
  <p>UPSC PYQ Explorer</p>

  <hr>

  <h2>Subjects</h2>

  <div id="subjects">
    Loading subjects...
  </div>

  <h2>Questions</h2>

  <div id="questions">
    Loading questions...
  </div>


  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL = 'https://obtqkzauwrcwhhzionur.supabase.co';

    const SUPABASE_KEY = 'sb_publishable_tbdljFG952LxK0X0UNroAA__MlkQJrX';

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // Load subjects
    async function loadSubjects() {

      const { data, error } = await supabaseClient
        .from('subjects')
        .select('*')
        .order('name');

      if (error) {
        document.getElementById('subjects').innerText =
          'Error loading subjects: ' + error.message;
        return;
      }

      const container = document.getElementById('subjects');

      container.innerHTML = '';

      data.forEach(subject => {

        const button = document.createElement('button');

        button.innerText = subject.name;

        container.appendChild(button);

      });
    }


    // Load questions
    async function loadQuestions() {

      const { data, error } = await supabaseClient
        .from('questions')
        .select('*')
        .order('year', { ascending: false });

      if (error) {
        document.getElementById('questions').innerText =
          'Error loading questions: ' + error.message;
        return;
      }

      const container = document.getElementById('questions');

      container.innerHTML = '';

      data.forEach(question => {

        const card = document.createElement('div');

        card.innerHTML = `
          <hr>

          <strong>
            ${question.year} — Question ${question.question_number}
          </strong>

          <p>${question.question_text}</p>

          <p>A. ${question.option_a}</p>
          <p>B. ${question.option_b}</p>
          <p>C. ${question.option_c}</p>
          <p>D. ${question.option_d}</p>

          <button onclick="alert('Answer: ${question.answer}')">
            Show Answer
          </button>
        `;

        container.appendChild(card);

      });
    }


    // Start the application
    loadSubjects();
    loadQuestions();

  </script>

</body>
</html>
