<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IASYAS - UPSC PYQ Explorer</title>
</head>

<body>

  <h1>IASYAS</h1>
  <p>UPSC PYQ Explorer</p>

  <hr>

  <h2>Subjects</h2>

  <div id="subjects">
    Loading subjects...
  </div>

  <h2 id="topics-title" style="display:none;">
    Topics
  </h2>

  <div id="topics"></div>

  <h2 id="selected-topic">Questions</h2>

  <div id="questions">
    Select a subject to explore its topics.
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      'https://obtqkzauwrcwhhzionur.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_tbdljFG952LxK0X0UNroAA__MlkQJrX';

    const supabaseClient =
      supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


    // Load subjects
    async function loadSubjects() {

      const { data, error } = await supabaseClient
        .from('subjects')
        .select('*')
        .order('name');

      if (error) {
        document.getElementById('subjects').innerText =
          'Error: ' + error.message;
        return;
      }

      const container =
        document.getElementById('subjects');

      container.innerHTML = '';

      data.forEach(subject => {

        const button =
          document.createElement('button');

        button.innerText = subject.name;

        button.onclick = () =>
          loadTopics(subject.id, subject.name);

        container.appendChild(button);

      });
    }


    // Load topics for selected subject
    async function loadTopics(subjectId, subjectName) {

      document.getElementById('topics-title').style.display =
        'block';

      const container =
        document.getElementById('topics');

      container.innerHTML =
        'Loading topics...';

      document.getElementById('questions').innerHTML =
        'Select a topic to see questions.';


      const { data, error } = await supabaseClient
        .from('topics')
        .select('*')
        .eq('subject_id', subjectId)
        .order('name');


      if (error) {

        container.innerText =
          'Error loading topics: ' + error.message;

        return;
      }


      container.innerHTML = '';


      data.forEach(topic => {

        const button =
          document.createElement('button');

        button.innerText = topic.name;

        button.onclick = () =>
  loadQuestions(topic.id, topic.name);

        container.appendChild(button);

        container.appendChild(
          document.createElement('br')
        );

      });
    }


    // Load questions for selected topic
    async function loadQuestions(topicId, topicName) {
  const container =
    document.getElementById('questions');

  container.innerHTML =
    'Loading questions...';


  const { data, error } = await supabaseClient
    .from('questions')
    .select('*')
    .eq('topic_id', topicId)
    .order('year', { ascending: false });


  if (error) {

    container.innerText =
      'Error loading questions: ' + error.message;

    return;
  }


  container.innerHTML = 'document.getElementById('selected-topic').innerText =
  `${topicName} — ${data.length} PYQ${data.length === 1 ? '' : 's'}`;';


  data.forEach(question => {

    const card =
      document.createElement('div');

    card.innerHTML = `

      <hr>

      <h3>
        ${question.year} — Question ${question.question_number}
      </h3>

      <p>
        ${question.question_text}
      </p>

      <p>A. ${question.option_a}</p>
      <p>B. ${question.option_b}</p>
      <p>C. ${question.option_c}</p>
      <p>D. ${question.option_d}</p>

      <button>
        Show Answer
      </button>

      <p class="answer" style="display:none;">
        <strong>Answer: ${question.answer}</strong>
      </p>

    `;

    const button =
      card.querySelector('button');

    const answer =
      card.querySelector('.answer');

    button.onclick = () => {

      answer.style.display = 'block';

      button.style.display = 'none';

    };

    container.appendChild(card);

  });

}


    // Start
    loadSubjects();

  </script>

</body>
</html>
